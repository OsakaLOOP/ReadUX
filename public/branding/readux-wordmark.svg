<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 120" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">ReadUX</title>
  <desc id="desc">蓝色 Read 字形、黄色 U 字形与浅蓝填充深蓝黑描边的 X 字形。</desc>
  <g id="readux-wordmark" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
    <!-- Read 部分 (实际渲染字重为 7.5，视觉上下边界约为 29.25 ~ 90.75) -->
    <g transform="translate(4.75 15) scale(.75)" stroke="#4d79b8">
      <path d="M24 96V24h33c27 0 27 38 0 38H24m33 0 27 34"/>
      <path transform="translate(-4 0)" d="M158 89c-6 6-14 9-23 9-16 0-27-11-27-28 0-18 11-29 25-29 15 0 25 10 25 24q0 4-4 4h-46"/>
      <path transform="translate(-4 0)" d="M235 69a27 27 0 1 1-54 0 27 27 0 1 1 54 0m0-27v55"/>
      <path transform="translate(-1 0)" d="M306 69a27 27 0 1 1-54 0 27 27 0 1 1 54 0m0-47v75"/>
    </g>

    <!-- U 部分：字重同步为 7.5，与 R 等高，底部与 a/d 圆弧对齐 -->
    <path stroke="#ffcc11" stroke-width="7.5" d="M250 33v36c0 13 8 19.5 19.5 19.5S289 82 289 69V33"/>

    <!-- X 部分：直角拐角(miter)、细描边(2.2)，拆分为两笔使 \ 完整挡住 / -->
    <g fill="#c2dde8" stroke="#152a43" stroke-width="2.2" stroke-linejoin="miter" stroke-linecap="butt">
      <!-- 底层：右上到左下 (/) -->
      <path d="M336.5 30.5h9.5L312.5 89.5h-9.5z"/>
      <!-- 顶层：左上到右下 (\) 遮挡底层 -->
      <path d="M303 30.5h9.5l33.5 59h-9.5z"/>
    </g>
  </g>
</svg>