name: Build and release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: none
            artifact: ReadUX-insider-portable-win64.zip
            nlp_asset: ReadUX-insider-portable-nlp.zip
            python_asset: ReadUX-insider-portable-windows-x64-python.zip
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: dmg/*.dmg
            nlp_asset: ReadUX-insider-portable-nlp.zip
            python_asset: ReadUX-insider-portable-macos-arm64-python.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tracked release resources
        run: npm run verify:release-resources

      - name: Download prebuilt NLP resources
        run: >-
          python scripts/fetch_release_resources.py
          --nlp-url https://github.com/${{ github.repository }}/releases/download/resources-v1/${{ matrix.nlp_asset }}
          --python-url https://github.com/${{ github.repository }}/releases/download/resources-v1/${{ matrix.python_asset }}
          --output release-resources

      - name: Verify generated release dependencies
        run: npm run verify:release-resources -- --require-generated

      - name: Build Windows desktop executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.github-release.conf.json --no-bundle

      - name: Build macOS desktop package
        if: runner.os == 'macOS'
        run: npm run tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.github-release.conf.json --bundles dmg

      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -X utf8 scripts/package_portable.py --target windows-x64 --binary target/${{ matrix.target }}/release/ReadUX.exe --output target/${{ matrix.target }}/release --name ReadUX-insider-portable-win64

      - name: Verify Windows executable and taskbar icons
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/verify_windows_icons.ps1 -Executable target/${{ matrix.target }}/release/ReadUX.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: readux-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: readux-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
